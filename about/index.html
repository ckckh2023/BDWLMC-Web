<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="关于 BDWL基岩荒地 Minecraft 服务器" />
    <title>关于 - BDWL基岩荒地</title>
    <link rel="stylesheet" href="/assets/css/common.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="icon" href="/assets/icons/icon64.png" />
  </head>
  <body>
    <!-- ==================== 清晰背景截图 ==================== -->
    <div
      class="join-bg"
      style="background-image: url('/assets/src/src3.png')"
      aria-hidden="true"
    ></div>

    <!-- ==================== Header ==================== -->
    <header class="site-header">
      <div class="site-header__left">
        <img
          class="site-header__avatar"
          src="/assets/icons/icon256.png"
          alt="服务器头像"
        />
        <span class="site-header__title">BDWL基岩荒地</span>
      </div>

      <nav class="site-header__nav" aria-label="主导航">
        <a class="site-header__nav-link" href="/">首页</a>
        <a class="site-header__nav-link" href="/join/">加入</a>
        <a class="site-header__nav-link" href="/display/">百态</a>
        <a class="site-header__nav-link" href="/about/">关于</a>
      </nav>

      <div class="site-header__right"></div>
    </header>

    <!-- ==================== Main ==================== -->
    <main class="join-main">
      <section style="max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
        <article class="join-card">
          <span class="join-card__eyebrow">社区</span>
          <h2 class="join-card__title">加入我们社区</h2>
          <p class="join-card__text">
            欢迎加入 BDWL基岩荒地 玩家社区！在这里与众多冒险者交流心得、分享作品、参与活动，
            第一时间获取服务器动态与版本更新，成为我们的一员。
          </p>
          <div class="sub-grid">
            <a
              class="sub-card"
              href="https://qm.qq.com/q/dFuQKuzLws"
              target="_blank"
              rel="noopener noreferrer"
            >
              <h3 class="sub-card__title">QQ 外部聊天群</h3>
              <p class="sub-card__text">面向所有玩家的公开交流群，自由畅聊。</p>
            </a>
            <a
              class="sub-card"
              href="https://qm.qq.com/q/3A9rhDIDjG"
              target="_blank"
              rel="noopener noreferrer"
            >
              <h3 class="sub-card__title">QQ 内部玩家群</h3>
              <p class="sub-card__text">服务器内部玩家群，获取动态与活动通知。</p>
            </a>
            <a
              class="sub-card"
              href="https://pd.qq.com/s/2vzy7goi2"
              target="_blank"
              rel="noopener noreferrer"
            >
              <h3 class="sub-card__title">QQ 频道</h3>
              <p class="sub-card__text">订阅 QQ 频道，观看内容与公告。</p>
            </a>
          </div>
        </article>

        <article class="join-card">
          <span class="join-card__eyebrow">服主</span>
          <h2 class="join-card__title">关于服主</h2>
          <p class="join-card__text">
            想了解更多关于服主的信息？欢迎通过以下渠道关注与交流。
          </p>
          <div class="sub-grid" style="grid-template-columns: 1fr 1fr">
            <a
              class="sub-card"
              href="https://xiao-blog.top"
              target="_blank"
              rel="noopener noreferrer"
            >
              <h3 class="sub-card__title">服主博客</h3>
              <p class="sub-card__text">服主个人的技术博客，记录开发心得与项目分享</p>
            </a>
            <a
              class="sub-card"
              href="http://live.bilibili.com/1790098980"
              target="_blank"
              rel="noopener noreferrer"
            >
              <h3 class="sub-card__title">服主 B 站直播</h3>
              <p class="sub-card__text">服主直播服务器内容，可以来这里提前体验服务器风情</p>
            </a>
          </div>
        </article>
      </section>
    </main>

    <script src="/assets/js/main.js"></script>
  </body>
</html>
