<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="群友百态 - BDWL基岩荒地 玩家作品集" />
    <title>百态 - BDWL基岩荒地</title>
    <link rel="stylesheet" href="/assets/css/common.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="icon" href="/assets/icons/icon64.png" />
  </head>
  <body class="page-display">
    <!-- ==================== 动态模糊背景 ==================== -->
    <div class="bg-blur" aria-hidden="true">
      <div class="bg-blur__layer"></div>
      <div class="bg-blur__layer"></div>
    </div>

    <!-- ==================== Header ==================== -->
    <header class="site-header">
      <div class="site-header__left">
        <img
          class="site-header__avatar"
          src="/assets/icons/icon256.png"
          alt="服务器头像"
        />
        <span class="site-header__title">BDWL基岩荒地</span>
      </div>

      <nav class="site-header__nav" aria-label="主导航">
        <a class="site-header__nav-link" href="/">首页</a>
        <a class="site-header__nav-link" href="/join/">加入</a>
        <a class="site-header__nav-link" href="/display/">百态</a>
        <a class="site-header__nav-link" href="/about/">关于</a>
      </nav>

      <div class="site-header__right"></div>
    </header>

    <!-- ==================== Main ==================== -->
    <main class="main">
      <section class="waterfall" id="display-list" data-display-list></section>
    </main>

    <!-- ==================== 图片预览 Lightbox ==================== -->
    <dialog class="lightbox" aria-label="图片预览">
      <button class="lightbox__close" type="button" aria-label="关闭">&times;</button>
      <img class="lightbox__image" alt="" />
    </dialog>

    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/display.js"></script>
  </body>
</html>
